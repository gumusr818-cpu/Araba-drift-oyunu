<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Pro Drift Oyunu - Kararlı Kamera</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #hud {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 15, 25, 0.85);
      border: 2px solid #00f0ff;
      border-radius: 12px;
      padding: 15px 25px;
      color: #fff;
      text-align: right;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    #speed {
      font-size: 38px;
      font-weight: 800;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }
    #gear {
      font-size: 22px;
      font-weight: 600;
      color: #ff0055;
      margin-top: 5px;
    }
    #controls-hint {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
      line-height: 1.5;
    }

    /* MOBİL DOKUNMATİK KONTROL BUTONLARI */
    .touch-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      backdrop-filter: blur(5px);
      touch-action: none;
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(0, 240, 255, 0.6);
      border-color: #00f0ff;
      transform: scale(0.95);
    }

    #btn-left { bottom: 30px; left: 20px; width: 75px; height: 75px; }
    #btn-right { bottom: 30px; left: 110px; width: 75px; height: 75px; }
    #btn-gas { bottom: 120px; right: 25px; width: 80px; height: 80px; background: rgba(0, 255, 120, 0.35); font-size: 18px; }
    #btn-brake { bottom: 25px; right: 25px; width: 80px; height: 80px; background: rgba(255, 50, 50, 0.35); font-size: 16px; }
    #btn-drift { bottom: 25px; right: 120px; width: 70px; height: 70px; background: rgba(255, 200, 0, 0.35); font-size: 13px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <div id="speed">0 <span style="font-size: 18px; color: #fff;">KM/H</span></div>
    <div id="gear">VİTES: 1</div>
  </div>

  <div id="controls-hint">
    <b>PC:</b> W/A/S/D veya Oklar + SPACE (El Freni)<br>
    <b>MOBİL:</b> Sol/Sağ Oklar & Gaz/Fren/Drift Butonları
  </div>

  <div id="btn-left" class="touch-btn">◀</div>
  <div id="btn-right" class="touch-btn">▶</div>
  <div id="btn-gas" class="touch-btn">GAZ</div>
  <div id="btn-brake" class="touch-btn">FREN</div>
  <div id="btn-drift" class="touch-btn">DRIFT</div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0c4ff);
    scene.fog = new THREE.FogExp2(0xa0c4ff, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- IŞIKLANDIRMA ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(150, 250, 100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    const d = 200;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- ZEMİN VE PİST ---
    const groundGeo = new THREE.PlaneGeometry(1200, 1200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const roadCanvas = document.createElement('canvas');
    roadCanvas.width = 1024;
    roadCanvas.height = 1024;
    const ctx = roadCanvas.getContext('2d');

    ctx.fillStyle = '#222222';
    ctx.fillRect(0, 0, 1024, 1024);

    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(512, 512, 400, 0, Math.PI * 2);
    ctx.arc(512, 512, 180, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.setLineDash([25, 25]);
    ctx.beginPath();
    ctx.arc(512, 512, 290, 0, Math.PI * 2);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(512, 0); ctx.lineTo(512, 1024);
    ctx.moveTo(0, 512); ctx.lineTo(1024, 512);
    ctx.lineWidth = 140;
    ctx.strokeStyle = '#222222';
    ctx.stroke();

    const roadTexture = new THREE.CanvasTexture(roadCanvas);
    const roadGeo = new THREE.PlaneGeometry(700, 700);
    const roadMat = new THREE.MeshStandardMaterial({ map: roadTexture, roughness: 0.7 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.02;
    road.receiveShadow = true;
    scene.add(road);

    // --- YOL BARİYERLERİ ---
    const barrierMat = new THREE.MeshStandardMaterial({ color: 0xff3838, roughness: 0.3, metalness: 0.5 });
    const barrierStripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    
    function createBarrier(x, z, rotY, length = 10) {
      const group = new THREE.Group();
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(length, 1.2, 0.8), barrierMat);
      mesh.position.y = 0.6;
      mesh.castShadow = true;
      group.add(mesh);

      const stripe = new THREE.Mesh(new THREE.BoxGeometry(length, 0.2, 0.85), barrierStripeMat);
      stripe.position.y = 1.0;
      group.add(stripe);

      group.position.set(x, 0, z);
      group.rotation.y = rotY;
      scene.add(group);
    }

    const barrierCount = 36;
    const radius = 355;
    for (let i = 0; i < barrierCount; i++) {
      const angle = (i / barrierCount) * Math.PI * 2;
      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius;
      createBarrier(x, z, -angle + Math.PI/2, 65);
    }

    // --- DETAYLI SPOR ARABA MODELİ ---
    const car = new THREE.Group();

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00a8ff, metalness: 0.85, roughness: 0.15 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.85 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x0097e6, metalness: 0.8, roughness: 0.2 });
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 });

    const mainBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.55, 4.2), bodyMat);
    mainBody.position.y = 0.5;
    mainBody.castShadow = true;
    car.add(mainBody);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.2), glassMat);
    cabin.position.set(0, 0.95, -0.2);
    cabin.castShadow = true;
    car.add(cabin);

    const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.05, 2.0), roofMat);
    roof.position.set(0, 1.22, -0.2);
    car.add(roof);

    const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.05, 0.4), bodyMat);
    spoilerWing.position.set(0, 1.1, -1.9);
    car.add(spoilerWing);
    const spoilerSup1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), bodyMat);
    spoilerSup1.position.set(-0.6, 0.95, -1.9);
    car.add(spoilerSup1);
    const spoilerSup2 = spoilerSup1.clone();
    spoilerSup2.position.x = 0.6;
    car.add(spoilerSup2);

    const wheels = [];
    const wheelPositions = [
      { x: -1.05, y: 0.35, z: 1.3 },
      { x: 1.05, y: 0.35, z: 1.3 },
      { x: -1.05, y: 0.35, z: -1.3 },
      { x: 1.05, y: 0.35, z: -1.3 }
    ];

    wheelPositions.forEach((pos, index) => {
      const wheelGroup = new THREE.Group();
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.25, 24), wheelMat);
      tire.rotation.z = Math.PI / 2;
      tire.castShadow = true;
      wheelGroup.add(tire);

      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.26, 12), rimMat);
      rim.rotation.z = Math.PI / 2;
      wheelGroup.add(rim);

      wheelGroup.position.set(pos.x, pos.y, pos.z);
      car.add(wheelGroup);
      wheels.push({ mesh: wheelGroup, isFront: index < 2 });
    });

    scene.add(car);

    // --- DUMAN VE İZ SİSTEMİ ---
    const smokeParticles = [];
    const smokeGeo = new THREE.SphereGeometry(0.25, 8, 8);
    const smokeMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee, transparent: true, opacity: 0.75 });

    function createSmoke(x, z) {
      const p = new THREE.Mesh(smokeGeo, smokeMat.clone());
      p.position.set(x + (Math.random() - 0.5) * 0.3, 0.1, z + (Math.random() - 0.5) * 0.3);
      scene.add(p);
      smokeParticles.push({ mesh: p, life: 1.0 });
    }

    const skidMarks = [];
    const skidMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a, side: THREE.DoubleSide });

    function createSkidMark(x, z) {
      const mark = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.32), skidMat);
      mark.rotation.x = Math.PI / 2;
      mark.position.set(x, 0.03, z);
      scene.add(mark);
      skidMarks.push(mark);
      if (skidMarks.length > 400) {
        const old = skidMarks.shift();
        scene.remove(old);
        old.geometry.dispose();
      }
    }

    // --- KONTROLLER ---
    const input = { forward: false, backward: false, left: false, right: false, drift: false };

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') input.forward = true;
      if (k === 's' || e.key === 'ArrowDown') input.backward = true;
      if (k === 'a' || e.key === 'ArrowLeft') input.left = true;
      if (k === 'd' || e.key === 'ArrowRight') input.right = true;
      if (e.key === ' ') input.drift = true;
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') input.forward = false;
      if (k === 's' || e.key === 'ArrowDown') input.backward = false;
      if (k === 'a' || e.key === 'ArrowLeft') input.left = false;
      if (k === 'd' || e.key === 'ArrowRight') input.right = false;
      if (e.key === ' ') input.drift = false;
    });

    function bindTouch(id, prop) {
      const el = document.getElementById(id);
      if (!el) return;
      const start = (e) => { e.preventDefault(); input[prop] = true; el.classList.add('active'); };
      const end = (e) => { e.preventDefault(); input[prop] = false; el.classList.remove('active'); };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }

    bindTouch('btn-gas', 'forward');
    bindTouch('btn-brake', 'backward');
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-drift', 'drift');

    // --- FİZİK VE OYUN DÖNGÜSÜ ---
    let posX = 0, posZ = 0;
    let speed = 0;
    let carAngle = 0;
    let moveAngle = 0;
    let steering = 0;

    const maxSpeed = 0.9;
    const accel = 0.007;
    const friction = 0.985;
    const turnSpeed = 0.035;

    function animate() {
      requestAnimationFrame(animate);

      if (input.forward) speed = Math.min(speed + accel, maxSpeed);
      else if (input.backward) speed = Math.max(speed - accel, -maxSpeed * 0.4);
      else speed *= friction;

      let targetSteer = 0;
      if (input.left) targetSteer = turnSpeed;
      if (input.right) targetSteer = -turnSpeed;
      steering += (targetSteer - steering) * 0.15;

      carAngle += steering * (speed / maxSpeed) * 1.2;

      let driftFactor = 0.88;
      if (input.drift || (Math.abs(steering) > 0.015 && Math.abs(speed) > 0.25)) {
        driftFactor = 0.965;
        speed *= 0.992;

        const cos = Math.cos(carAngle);
        const sin = Math.sin(carAngle);
        const rLeftX = posX - sin * 1.3 - cos * 1.05;
        const rLeftZ = posZ - cos * 1.3 + sin * 1.05;
        const rRightX = posX - sin * 1.3 + cos * 1.05;
        const rRightZ = posZ - cos * 1.3 - sin * 1.05;

        createSmoke(rLeftX, rLeftZ);
        createSmoke(rRightX, rRightZ);
        createSkidMark(rLeftX, rLeftZ);
        createSkidMark(rRightX, rRightZ);
      }

      moveAngle = moveAngle * driftFactor + carAngle * (1 - driftFactor);

      posX += Math.sin(moveAngle) * speed;
      posZ += Math.cos(moveAngle) * speed;

      car.position.set(posX, 0, posZ);
      car.rotation.y = carAngle;

      const distFromCenter = Math.sqrt(posX * posX + posZ * posZ);
      if (distFromCenter > 350) {
        posX *= 0.98;
        posZ *= 0.98;
        speed *= -0.4;
      }

      wheels.forEach(w => {
        if (w.isFront) w.mesh.rotation.y = steering * 6;
        w.mesh.children[0].rotation.x += speed * 0.8;
      });

      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const p = smokeParticles[i];
        p.life -= 0.025;
        p.mesh.scale.addScalar(0.04);
        p.mesh.material.opacity = p.life * 0.6;
        p.mesh.position.y += 0.02;

        if (p.life <= 0) {
          scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          smokeParticles.splice(i, 1);
        }
      }

      // --- KARARLI KAMERA TAKİBİ ---
      const camTargetX = posX - Math.sin(carAngle) * 8.5;
      const camTargetZ = posZ - Math.cos(carAngle) * 8.5;
      const camTargetY = 3.8;

      camera.position.x += (camTargetX - camera.position.x) * 0.12;
      camera.position.y += (camTargetY - camera.position.y) * 0.12;
      camera.position.z += (camTargetZ - camera.position.z) * 0.12;
      camera.lookAt(posX, 0.8, posZ);

      // HUD Göstergeleri
      const kmh = Math.round(Math.abs(speed) * 210);
      document.getElementById('speed').innerHTML = `${kmh} <span style="font-size: 18px; color: #fff;">KM/H</span>`;

      let gear = 1;
      if (speed < 0) gear = 'R';
      else if (kmh > 120) gear = 4;
      else if (kmh > 75) gear = 3;
      else if (kmh > 35) gear = 2;
      document.getElementById('gear').innerText = `VİTES: ${gear}`;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
  </html>
